# localhost:8080
#   /          -> front-end, "Mapa" mode (./frontend/index.html), talks to /api/v1
#   /painel    -> front-end, "Painel" (dashboard) mode (./frontend/painel.html)
#   /app/*     -> front-end assets
#   /leads     -> leads mode: qualified leads, WhatsApp queue, templates, metrics (./frontend/leads.html)
#   /proposta  -> printable proposal for a lead (./frontend/proposta.html)
#   /leads-api -> leads server (./leads), the database behind /leads
#   /classic   -> original scraper UI (patched, see below)
#   everything else (/api, /jobs, /scrape, /static, /download…) -> scraper container
server {
    listen 80;
    client_max_body_size 50m;

    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /painel {
        root /usr/share/nginx/html;
        try_files /painel.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /leads {
        root /usr/share/nginx/html;
        try_files /leads.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /proposta {
        root /usr/share/nginx/html;
        try_files /proposta.html =404;
        add_header Cache-Control "no-cache";
    }

    location /leads-api/ {
        proxy_pass http://leads:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location /app/ {
        alias /usr/share/nginx/html/;
        add_header Cache-Control "no-cache";
    }

    location = /classic {
        proxy_pass http://google-maps-scraper:8080/;
        include /etc/nginx/conf.d/scraper-proxy.inc;
    }

    location / {
        proxy_pass http://google-maps-scraper:8080;
        include /etc/nginx/conf.d/scraper-proxy.inc;
    }
}
